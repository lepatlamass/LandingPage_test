# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKGROUNDS_ON_DEMAND }}
          channelId: live
          projectId: backgrounds-on-demand
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_CHARIOW_YEARLY_CHECKOUT: ${{ secrets.CHARIOW_YEARLY_CHECKOUT }}
          NEXT_PUBLIC_CHARIOW_MONTHLY_CHECKOUT: ${{ secrets.CHARIOW_MONTHLY_CHECKOUT }}
          NEXT_PUBLIC_CHARIOW_CREDITS_CHECKOUT: ${{ secrets.CHARIOW_CREDITS_CHECKOUT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WELCOME_TEMPLATE_ID: ${{ secrets.RESEND_WELCOME_TEMPLATE_ID }}
          CHARIOW_API_KEY: ${{ secrets.CHARIOW_API_KEY }}
